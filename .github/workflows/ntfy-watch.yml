name: Ntfy Codex reset watcher

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send one TEST notification without changing watcher state
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ntfy-reset-watcher
  cancel-in-progress: false

jobs:
  watch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check feed and notify new resets
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE_BRANCH: ${{ github.event.repository.default_branch }}
          TEST_NOTIFICATION: ${{ inputs.test_notification && 'true' || 'false' }}
        run: python scripts/ntfy-watch.py
